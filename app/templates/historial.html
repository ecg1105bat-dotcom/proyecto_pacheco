{% extends "base.html" %}
{% block content %}
<h2 style="text-align:center;">Historial de Lecturas</h2>

<table border="1" style="width:90%; margin:20px auto; border-collapse:collapse; text-align:center;">

  <tr style="background:#f0f0f0;">

    <th>ID</th>

    <th>Temperatura</th>

    <th>Humedad</th>

    <th>pH</th>

    <th>Fecha</th>

    <th>Hora</th>

  </tr>

  {% for r in datos %}
  <tr>

    <td>{{ r.id }}</td>
    <td>{{ r.temperatura }}</td>
    <td>{{ r.humedad }}</td>
    <td>{{ r.ph }}</td>
    <td>{{ r.fecha }}</td>
    <td>{{ r.hora }}</td>

  </tr>
  
  {% endfor %}
</table>
{% endblock %}
