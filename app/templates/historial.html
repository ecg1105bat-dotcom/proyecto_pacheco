{% extends "base.html" %}
{% block content %}
<div class="historial-head">
    <h1 class="title">Historial de Lecturas</h1>
    <button class="btn-actualizar" type="button">Actualizar</button>
</div>

<div class="table-wrap">

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Temperatura</th>
                <th>Humedad</th>
                <th>pH</th>
                <th>Fecha</th>
                <th>Hora</th>
            </tr>
        </thead>


        <tbody>
            {% for r in registros %}
            <tr>
                <td>{{ r.id }}</td>
                <td>{{ r.temp }}</td>
                <td>{{ r.hum }}</td>
                <td>{{ r.ph }}</td>
                <td>{{ r.fecha }}</td>
                <td>{{ r.hora }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
