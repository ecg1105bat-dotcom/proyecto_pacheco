{% extends "base.html" %}
{% block content %}
<div style="text-align: center;">
  <h2 style="display: inline-block;"> Historial de Lectutras </h2>

  <button onclick="location.reload()" style="background: #2E7D32; color:white; border: none;
    padding: 6px 14px; border-radius: 5px; cursor: pointer; margin-left: 10px;"> Actualizar </button>

</div>

<table border="1" style="width: 90%; margin: 20px auto; border-collapse: collapse;
 text-align: center;">

  <tr style="background: #f0f0f0;">
    <th> ID </th>

    <th> Temperatura (°C) </th>

    <th> Humedad (%) </th>

    <th> pH </th>

    <th> Fecha </th>

    <th> Hora </th>
  </tr>


  {% for r in datos %}
  <tr>

    <td>{{ r.id }}</td>
    <td>{{ r.temperatura }}</td>
    <td>{{ r.humedad }}</td>
    <td>{{ r.ph }}</td>
    <td>{{ r.fecha }}</td>
    <td>{{ r.hora }}</td>

  </tr>

{% endfor %}
</table>
{% endblock %}
