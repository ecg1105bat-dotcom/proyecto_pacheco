{% extends "base.html" %}
{% block content %}
<h2> Gráficas </h2>

<div style="max-width:800px; margin-top: auto;">
  <canvas id="grafica"></canvas>
</div>


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

 async function cargar() {
    const res = await fetch('/datosGraficas');
    const datos = await res.json();

    const labels = datos.map(d => d.hora);
    const temp = datos.map(d => d.temperatura);
    const hum = datos.map( d => d.humedad);
    const ph = datos.ma( d => d.ph);


    new Chart(document.getElementById('grafica'),{
        type: 'line',
        data:{
            labels: labels,
            datasets:[
                 { label: 'Temperatura', data: temp, borderColor: 'red', fill: false },
                 { label: 'Humedad', data: hum, borderColor: 'blue', fill: false },
                 { label: 'pH', data: ph, borderColor: 'green', fill: false }
            ]
        }
    });
 }

cargar();
setInterval(cargar, 20000);
</script>
{% endblock %}
